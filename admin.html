<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>TTU Class Rep approvals</title>
<style>
body{font-family:system-ui,sans-serif;background:#f6f8fd;color:#0f1b45;margin:0;padding:1rem}
.w{max-width:960px;margin:auto}h1{color:#183078}
input{padding:.6rem;border:1px solid #c9d4ee;border-radius:6px;width:260px;max-width:100%}
button{background:#183078;color:#fff;border:0;border-radius:6px;padding:.5rem .9rem;font-weight:600;cursor:pointer}
button.r{background:#fff;color:#7a1515;border:1px solid #d64545}
table{width:100%;border-collapse:collapse;background:#fff;margin-top:1rem;min-width:720px}
td,th{padding:.5rem;border-bottom:1px solid #c9d4ee;text-align:left;font-size:.85rem;vertical-align:top}th{color:#183078}
</style></head><body><div class="w">
<h1>Class Rep approvals</h1>
<p>Check each request against your department records before approving.</p>
<input id="k" type="password" placeholder="Admin key" autocomplete="current-password"> <button id="go">Load requests</button>
<p id="m"></p>
<div style="overflow-x:auto"><table><thead><tr><th>Name</th><th>Index</th><th>Email</th><th>Faculty / Department / Program</th><th>Status</th><th></th></tr></thead><tbody id="b"></tbody></table></div>
</div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function call(path,method){const r=await fetch('/api/admin'+path,{method,headers:{'x-admin-key':$('k').value}});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Failed');return j}
async function load(){
  try{const rows=await call('/reps','GET');$('m').textContent=rows.length+' request(s)';
    $('b').innerHTML=rows.map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.idx)}</td><td>${esc(r.email)}</td><td>${esc(r.faculty)}<br>${esc(r.department)}<br>${esc(r.program)}</td><td>${esc(r.status)}</td>
    <td><button data-i="${esc(r.idx)}" data-a="approve">Approve</button> <button class="r" data-i="${esc(r.idx)}" data-a="reject">Reject</button></td></tr>`).join('')}
  catch(e){$('m').textContent=e.message}
}
$('go').onclick=load;
$('b').onclick=async e=>{const b=e.target.closest('button');if(!b)return;try{await call('/reps/'+encodeURIComponent(b.dataset.i)+'/'+b.dataset.a,'POST');load()}catch(x){$('m').textContent=x.message}};
</script></body></html>
